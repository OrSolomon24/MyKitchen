name: Deploy agent to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/deploy-agent.yml'
  workflow_dispatch:

concurrency:
  group: deploy-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Must match (or be compatible with) agent/.python-version -- `vercel build`
      # builds the Python function locally and needs a matching interpreter on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Vercel's Python builder shells out to `uv` to install dependencies;
      # it's not preinstalled on ubuntu-latest.
      - uses: astral-sh/setup-uv@v5

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # This project's "Root Directory" is set to "agent" in Vercel's dashboard,
      # so these commands run from the repo root and let Vercel resolve into
      # agent/ itself -- running them from inside agent/ would double the path.
      - name: Pull Vercel project settings & env vars
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
