name: Deploy agent to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/deploy-agent.yml'
  workflow_dispatch:

concurrency:
  group: deploy-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # This project's "Root Directory" is set to "agent" in Vercel's
      # dashboard, and the CLI applies that relative to wherever it's
      # invoked -- running from inside agent/ would double the path to
      # agent/agent. Run from the repo root instead.
      #
      # Remote build (not `vercel build` + --prebuilt): Vercel's own build
      # infrastructure reads Environment Variables straight from the Project
      # Settings dashboard, and already has the right Python/uv toolchain.
      - name: Deploy to Vercel (production)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
